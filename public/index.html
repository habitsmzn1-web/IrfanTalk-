
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>IrfanTalk</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
      min-height: 100vh;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header style="
    background:#182438;
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #29384d;
  ">
    <div>
      <h2>IrfanTalk</h2>
      <p style="color:#22c55e;font-size:12px;">
        ● Online
      </p>
    </div>

    <button id="profileBtn" style="
      background:#263b55;
      color:white;
      border:0;
      border-radius:50%;
      width:45px;
      height:45px;
      font-size:20px;
    ">
      👤
    </button>
  </header>

  <main id="app">
    <section id="home">
      <h3 style="padding:20px;">
        Welcome to IrfanTalk
      </h3>
    </section>
  </main>

  <section id="friends" style="padding:20px;">
    <h3 style="margin-bottom:15px;">
      👥 My Friends
    </h3>

    <input
      type="text"
      id="searchFriend"
      placeholder="Search friends..."
      style="
        width:100%;
        padding:13px;
        border-radius:10px;
        border:1px solid #35445a;
        background:#182438;
        color:white;
        margin-bottom:15px;
      "
    >

    <button id="addFriend" style="
      padding:12px 18px;
      background:#2563eb;
      color:white;
      border:0;
      border-radius:9px;
    ">
      + Add Friend
    </button>

    <div id="friendsList" style="margin-top:20px;">
      <p style="color:#9ca3af;">
        No friends added yet.
      </p>
    </div>
  </section>

  <section id="walkieTalkie" style="
    padding:25px 20px;
    text-align:center;
    background:#182438;
    margin:15px;
    border-radius:18px;
  ">
    <h2>🎙️ Walkie-Talkie</h2>

    <p style="color:#9ca3af;margin:15px 0 25px;">
      Press and Hold to Talk
    </p>

    <button id="talkButton" style="
      width:160px;
      height:160px;
      border-radius:50%;
      border:6px solid #60a5fa;
      background:#2563eb;
      color:white;
      font-size:48px;
      box-shadow:0 0 25px #2563eb66;
      touch-action:none;
    ">
      🎤
    </button>

    <p id="talkStatus" style="
      color:#22c55e;
      margin-top:20px;
    ">
      Ready to Talk
    </p>
  </section>

  <section id="chatSection" style="
    margin:15px;
    padding:20px;
    background:#182438;
    border-radius:18px;
  ">
    <h2>💬 IrfanTalk Chat</h2>

    <div id="chatMessages" style="
      height:220px;
      overflow-y:auto;
      margin-top:18px;
      padding:12px;
      background:#101827;
      border-radius:12px;
    ">
      <p style="color:#9ca3af;">
        Welcome to IrfanTalk!
      </p>
    </div>

    <form id="chatForm" style="
      display:flex;
      gap:8px;
      margin-top:15px;
    ">
      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        style="
          flex:1;
          min-width:0;
          padding:13px;
          border:0;
          border-radius:10px;
          background:#263b55;
          color:white;
        "
      >

      <button type="submit" style="
        padding:12px;
        background:#2563eb;
        color:white;
        border:0;
        border-radius:10px;
      ">
        Send
      </button>
    </form>
  </section>

 
<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const chatForm = document.getElementById("chatForm");
const messageInput = document.getElementById("messageInput");
const chatMessages = document.getElementById("chatMessages");

chatForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const message = messageInput.value.trim();

    if (!message) return;

    if (!socket.connected) {
        alert("Internet connection check karein.");
        return;
    }

    socket.emit("chat message", message);
    messageInput.value = "";
});

socket.on("chat message", function(message) {
    const msg = document.createElement("p");

    msg.textContent = message;
    msg.style.padding = "10px";
    msg.style.margin = "8px 0";
    msg.style.background = "#263b55";
    msg.style.borderRadius = "10px";
    msg.style.color = "white";

    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
});

socket.on("connect_error", function() {
    console.log("Chat server connection failed");
});


const addFriendBtn = document.getElementById("addFriend");
const friendsList = document.getElementById("friendsList");
const searchFriend = document.getElementById("searchFriend");

let friends = JSON.parse(localStorage.getItem("irfantalkFriends") || "[]");

function showFriends(filter = "") {
    friendsList.innerHTML = "";

    const filtered = friends.filter(name =>
        name.toLowerCase().includes(filter.toLowerCase())
    );

    if (filtered.length === 0) {
        friendsList.textContent = "No friends found.";
        return;
    }

    filtered.forEach(name => {
        const item = document.createElement("p");
        item.textContent = "👤 " + name;
        item.style.padding = "12px";
        item.style.margin = "8px 0";
        item.style.background = "#263b55";
        item.style.borderRadius = "10px";
        friendsList.appendChild(item);
    });
}

addFriendBtn.addEventListener("click", function() {
    const name = prompt("Enter your friend's name:");
    if (!name || !name.trim()) return;

    const cleanName = name.trim();

    if (friends.includes(cleanName)) {
        alert("Friend already exists.");
        return;
    }

    friends.push(cleanName);
    localStorage.setItem("irfantalkFriends", JSON.stringify(friends));
    showFriends(searchFriend.value);
});

searchFriend.addEventListener("input", function() {
    showFriends(searchFriend.value);
});

showFriends();
</script>

</body>
</html>
