background:linear-gradient(135deg,#792cff,#08c9e8);
box-shadow:0 0 30px #08c9e899;

        "
      >

 </main>
<script src="/socket.io/socket.io.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const socket = io();
// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyAs-r9cPPBpxjswAcAel5WvFQnlU-07XiE",
  authDomain: "irfantalk.firebaseapp.com",
  databaseURL: "https://irfantalk-default-rtdb.firebaseio.com",
  projectId: "irfantalk",
  storageBucket: "irfantalk.firebasestorage.app",
  messagingSenderId: "218169866517",
  appId: "1:218169866517:web:447670dc6a565e1e7b511c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
 // Show app after successful login
auth.onAuthStateChanged(function(user) {
  const loginScreen = document.getElementById("loginScreen");

  if (user) {
    db.ref("publicUsers/" + user.uid).update({
        email: user.email || "",
        name: user.displayName || (user.email ? user.email.split("@")[0] : "IrfanTalk User")
    }).catch(function(error) {
        console.error("Profile save error:", error);
    });

    loginScreen.style.display = "none";
    document.querySelectorAll(
      "body > header, body > main, body > section"
    ).forEach(function(element) {
      element.style.display = "block";
    });
  } else {
    loginScreen.style.display = "flex";
  }
});

// Google Login
document.getElementById("googleLogin").addEventListener("click", function() {
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider).catch(function(error) {
    alert("Google Login Error: " + error.message);
  });
});

// Email Signup
document.getElementById("emailSignup").addEventListener("click", function() {
  const email = prompt("Enter your email:");
  if (!email) return;

  const password = prompt("Create a password (at least 6 characters):");
  if (!password) return;

  auth.createUserWithEmailAndPassword(email, password)
    .catch(function(error) {
      alert("Signup Error: " + error.message);
    });
});

// Email Login
document.getElementById("loginLink").addEventListener("click", function() {
  const email = prompt("Enter your email:");
  if (!email) return;

  const password = prompt("Enter your password:");
  if (!password) return;

  auth.signInWithEmailAndPassword(email, password)
    .catch(function(error) {
      alert("Login Error: " + error.message);
    });
});

const chatForm = document.getElementById("chatForm");
const messageInput = document.getElementById("messageInput");
const chatMessages = document.getElementById("chatMessages");

chatForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const message = messageInput.value.trim();

    if (!message) return;

    if (!socket.connected) {
        alert("Internet connection check karein.");
        return;
    }

    socket.emit("chat message", message);
    messageInput.value = "";
});

socket.on("chat message", function(message) {
    const msg = document.createElement("p");

    msg.textContent = message;
    msg.style.padding = "10px";
    msg.style.margin = "8px 0";
    msg.style.background = "linear-gradient(90deg, #792cff, #08c9e8)";
    msg.style.borderRadius = "10px";
    msg.style.color = "white";

    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
});

socket.on("connect_error", function() {
    console.log("Chat server connection failed");
});


const addFriendBtn = document.getElementById("addFriend");
const friendsList = document.getElementById("friendsList");
const searchFriend = document.getElementById("searchFriend");

let friends = JSON.parse(localStorage.getItem("irfantalkFriends") || "[]");

function showFriends(filter = "") {
    friendsList.innerHTML = "";

    const filtered = friends.filter(name =>
        name.toLowerCase().includes(filter.toLowerCase())
    );

    if (filtered.length === 0) {
        friendsList.textContent = "No friends found.";
        return;
    }

    filtered.forEach(name => {
        const item = document.createElement("p");
        item.textContent = "👤 " + name;
        item.style.padding = "12px";
        item.style.margin = "8px 0";
        item.style.background = "#263b55";
        item.style.borderRadius = "10px";
        friendsList.appendChild(item);
    });
}

addFriendBtn.addEventListener("click", function() {
    const name = prompt("Enter your friend's name:");
    if (!name || !name.trim()) return;

    const cleanName = name.trim();

    if (friends.includes(cleanName)) {
        alert("Friend already exists.");
        return;
    }

    friends.push(cleanName);
    localStorage.setItem("irfantalkFriends", JSON.stringify(friends));
    showFriends(searchFriend.value);
});

searchFriend.addEventListener("input", function() {
    showFriends(searchFriend.value);
});

showFriends();

// ===== IRFANTALK WALKIE-TALKIE VOICE SYSTEM =====

const talkButton = document.getElementById("talkButton");
const talkStatus = document.getElementById("talkStatus");

const voiceSocket = io();
const VOICE_ROOM = "irfantalk-test-room";

const peerConnections = {};
let localVoiceStream = null;
let isTalking = false;

const iceServers = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
    ]
};

function updateTalkStatus(message, color) {
    talkStatus.textContent = message;
    talkStatus.style.color = color;
}

function createPeerConnection(peerId) {
    if (peerConnections[peerId]) {
        return peerConnections[peerId];
    }

    const pc = new RTCPeerConnection(iceServers);

    const audioTransceiver = pc.addTransceiver("audio", {
        direction: "sendrecv"
    });

    peerConnections[peerId] = {
        pc: pc,
        sender: audioTransceiver.sender,
        pendingCandidates: []
    };

    pc.onicecandidate = function(event) {
        if (event.candidate) {
            voiceSocket.emit("voice-ice-candidate", {
                target: peerId,
                candidate: event.candidate
            });
        }
    };

    pc.ontrack = function(event) {
        let audio = document.getElementById(
            "voice-audio-" + peerId
        );

        if (!audio) {
            audio = document.createElement("audio");
            audio.id = "voice-audio-" + peerId;
            audio.autoplay = true;
            audio.playsInline = true;
            document.body.appendChild(audio);
        }

        audio.srcObject = event.streams[0] || new MediaStream([event.track]);
audio.play().catch(error => console.log("Audio playback:", error));
    };

    pc.onconnectionstatechange = function() {
        if (pc.connectionState === "connected") {
            updateTalkStatus("Voice Connected", "#22c55e");
        }
    };

    return pc;
}

async function startVoiceConnection(peerId) {
    const peer = createPeerConnection(peerId);
    const pc = peer.pc;

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    voiceSocket.emit("voice-offer", {
        target: peerId,
        offer: pc.localDescription
    });
}

voiceSocket.on("connect", function() {
    voiceSocket.emit("join-voice-room", VOICE_ROOM);
    updateTalkStatus("Voice room joined", "#22c55e");
});

voiceSocket.on("voice-room-users", async function(users) {
    for (const peerId of users) {
        await startVoiceConnection(peerId);
    }
});

voiceSocket.on("voice-offer", async function(data) {
    const peer = createPeerConnection(data.from);
    const pc = peer.pc;

    await pc.setRemoteDescription(data.offer);

    for (const candidate of peer.pendingCandidates) {
        await pc.addIceCandidate(candidate);
    }
    peer.pendingCandidates = [];

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    voiceSocket.emit("voice-answer", {
        target: data.from,
        answer: pc.localDescription
    });
});

voiceSocket.on("voice-answer", async function(data) {
    const peer = peerConnections[data.from];
    if (!peer) return;

    await peer.pc.setRemoteDescription(data.answer);

    for (const candidate of peer.pendingCandidates) {
        await peer.pc.addIceCandidate(candidate);
    }
    peer.pendingCandidates = [];
});

voiceSocket.on("voice-ice-candidate", async function(data) {
    const peer = peerConnections[data.from];
    if (!peer) return;

    if (peer.pc.remoteDescription) {
        await peer.pc.addIceCandidate(data.candidate);
    } else {
        peer.pendingCandidates.push(data.candidate);
    }
});

voiceSocket.on("voice-user-left", function(data) {
    const peer = peerConnections[data.userId];

    if (peer) {
        peer.pc.close();
        delete peerConnections[data.userId];
    }

    const audio = document.getElementById(
        "voice-audio-" + data.userId
    );

    if (audio) audio.remove();

    updateTalkStatus("Friend disconnected", "#f59e0b");
});

async function pressToTalk() {
    isTalking = true;

    try {
        if (!localVoiceStream) {
            localVoiceStream = await navigator.mediaDevices.getUserMedia({
                audio: true
            });

            const microphoneTrack =
                localVoiceStream.getAudioTracks()[0];

            for (const peerId in peerConnections) {
                await peerConnections[peerId].sender
                    .replaceTrack(microphoneTrack);
            }
        }

        const track = localVoiceStream.getAudioTracks()[0];
        track.enabled = isTalking;

        updateTalkStatus("TRANSMITTING... 🎙️", "#22c55e");

    } catch (error) {
        isTalking = false;
        updateTalkStatus(
            "Microphone permission required",
            "#ef4444"
        );
        alert("Microphone permission allow karein.");
    }
}

function releaseTalk() {
    isTalking = false;

    if (localVoiceStream) {
        localVoiceStream.getAudioTracks().forEach(track => {
            track.enabled = false;
        });
    }

    updateTalkStatus("Ready to Talk", "#22c55e");
}

talkButton.addEventListener("pointerdown", function(event) {
    event.preventDefault();
    pressToTalk();
});

talkButton.addEventListener("pointerup", releaseTalk);
talkButton.addEventListener("pointercancel", releaseTalk);
talkButton.addEventListener("lostpointercapture", releaseTalk);

updateTalkStatus("Connecting to voice room...", "#f59e0b");

// ===== END IRFANTALK VOICE SYSTEM =====

</script>
