<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IrfanTalk - Connect with Friends</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101311;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.container{
  width:100%;
  max-width:420px;
  text-align:center;
}
.logo{margin-bottom:28px}
.logo svg{width:76px;height:76px}
.logo h1{
  color:#c6fa54;
  font-size:32px;
  margin:8px 0;
}
.logo p{color:#9da89c;margin:0}
.card{
  background:#191e19;
  border:1px solid #303a30;
  border-radius:20px;
  padding:25px;
  text-align:left;
}
h2{text-align:center;margin-top:0}
input{
  width:100%;
  padding:15px;
  margin:9px 0;
  border-radius:10px;
  border:1px solid #394439;
  background:#101710;
  color:white;
  font-size:16px;
}
button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#c6fa54;
  color:#101710;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.secondary{
  background:#303a30;
  color:white;
}
.link{
  color:#c6fa54;
  text-align:center;
  display:block;
  margin-top:18px;
  cursor:pointer;
}
#message{
  text-align:center;
  color:#c6fa54;
  margin-top:15px;
  overflow-wrap:anywhere;
}
#app{display:none}
.welcome{
  text-align:center;
  padding:25px 0;
}
.small{color:#9da89c;font-size:13px;text-align:center}
</style>
</head>

<body>
<div class="container">

  <div class="logo">
    <svg viewBox="0 0 100 100" fill="none"
      xmlns="http://www.w3.org/2000/svg">
      <rect x="27" y="15" width="46" height="72" rx="12"
        stroke="#C6FA54" stroke-width="5"/>
      <path d="M43 15V7H57V15" stroke="#C6FA54" stroke-width="5"/>
      <rect x="37" y="27" width="26" height="20" rx="4"
        stroke="#C6FA54" stroke-width="4"/>
      <path d="M39 57H61M39 65H61" stroke="#C6FA54"
        stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="77" r="4" fill="#C6FA54"/>
      <path d="M76 29Q91 39 76 49M82 20Q105 39 82 58"
        stroke="#C6FA54" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>IrfanTalk</h1>
    <p>Talk • Chat • Connect</p>
  </div>

  <div class="card" id="authCard">
    <h2 id="formTitle">Welcome Back</h2>

    <input id="name" type="text"
      placeholder="Your name" style="display:none">

    <input id="email" type="email"
      placeholder="Email address">

    <input id="password" type="password"
      placeholder="Password">

    <button id="mainButton" onclick="submitForm()">Login</button>

    <span class="link" id="switchLink" onclick="switchMode()">
      New here? Create Account
    </span>

    <span class="link" onclick="resetPassword()">
      Forgot Password?
    </span>

    <p id="message"></p>
  </div>

  <div class="card" id="app">
    <div class="welcome">
      <h2>Welcome to IrfanTalk!</h2>
      <p id="userEmail" class="small"></p>
      <p>Your account is ready.</p>
    </div>
    <button onclick="logout()">Logout</button>
  </div>

  <p class="small">Made for friends, made for connection.</p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAs-r9cPPBpxjswAcAel5WvFQnlU-07XiE",
  authDomain: "irfantalk.firebaseapp.com",
  databaseURL: "https://irfantalk-default-rtdb.firebaseio.com",
  projectId: "irfantalk",
  storageBucket: "irfantalk.firebasestorage.app",
  messagingSenderId: "218169866517",
  appId: "1:218169866517:web:447670dc6a565e1e7b511c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let createMode = false;

function switchMode(){
  createMode = !createMode;

  document.getElementById("formTitle").textContent =
    createMode ? "Create Your Account" : "Welcome Back";

  document.getElementById("mainButton").textContent =
    createMode ? "Create Account" : "Login";

  document.getElementById("switchLink").textContent =
    createMode ? "Already registered? Login" :
    "New here? Create Account";

  document.getElementById("name").style.display =
    createMode ? "block" : "none";

  showMessage("");
}

function showMessage(text){
  document.getElementById("message").textContent = text;
}

async function submitForm(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const name = document.getElementById("name").value.trim();
  const button = document.getElementById("mainButton");

  if(!email || !password){
    showMessage("Please enter email and password.");
    return;
  }

  if(password.length < 6){
    showMessage("Password must be at least 6 characters.");
    return;
  }

  if(createMode && !name){
    showMessage("Please enter your name.");
    return;
  }

  button.disabled = true;
  showMessage("Please wait...");

  try{
    if(createMode){
      const result = await auth.createUserWithEmailAndPassword(
        email,password
      );
      await result.user.updateProfile({displayName:name});
    }else{
      await auth.signInWithEmailAndPassword(email,password);
    }
  }catch(error){
    showMessage(error.message);
  }finally{
    button.disabled = false;
  }
}

async function resetPassword(){
  const email = document.getElementById("email").value.trim();

  if(!email){
    showMessage("First enter your email address.");
    return;
  }

  try{
    await auth.sendPasswordResetEmail(email);
    showMessage("Password reset email sent. Check your inbox.");
  }catch(error){
    showMessage(error.message);
  }
}

function logout(){
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("authCard").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("userEmail").textContent=user.email;
  }else{
    document.getElementById("authCard").style.display="block";
    document.getElementById("app").style.display="none";
  }
});
</script>
</body>
</html>
