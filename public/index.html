
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>IrfanTalk</title>

<style>/* IrfanTalk Purple-Cyan Login Design */

body {
    background: linear-gradient(160deg, #21103f, #080713 75%);
    color: #ffffff;
    font-family: Arial, sans-serif;
}

#loginScreen {
    min-height: 100vh;
    padding: 35px 6% 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
}

.it-logo {
    width: 170px;
    height: 170px;
    border: 3px solid #8b45ff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 85px;
    color: #08d8f5;
    box-shadow: 0 0 30px #792cff55;
    margin: 35px auto;
}

.it-brand {
    font-size: 38px;
    font-weight: bold;
}

.it-brand span {
    color: #08d8f5;
}

.it-tagline {
    letter-spacing: 7px;
    color: #aaa;
    margin-top: 12px;
}

.it-auth {
    width: 100%;
    max-width: 500px;
    margin-top: 40px;
}

.it-auth button {
    width: 100%;
    padding: 19px;
    margin: 10px 0;
    border: 0;
    border-radius: 18px;
    font-size: 18px;
    font-weight: bold;
}

.it-google {
    background: white;
    color: #171326;
}

.it-email {
    background: linear-gradient(90deg, #792cff, #08c9e8);
    color: white;
}

.it-login-link {
    color: #08d8f5;
    margin: 22px 0;
}
</style>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #21103f, #080713 75%);
      color: #ffffff;
      min-height: 100vh;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

body > header,
body > main,
body > section {
    display: none;
}

  </style>
</head>

<body>

<div id="loginScreen">
  <div class="it-logo">
    <div style="font-size:75px;">📻</div>
  </div>

  <div class="it-brand">
    Irfan<span>Talk</span>
  </div>

  <div class="it-tagline">VOICE CONNECTS</div>

  <div class="it-auth">
    <button class="it-google" id="googleLogin">
      G Sign up with Google
    </button>

    <p>Or</p>

    <button class="it-email" id="emailSignup">
      ✉ Sign Up with Email
    </button>

    <p class="it-login-link">
      Already have an account?
      <span id="loginLink">Log in</span>
    </p>
  </div>
</div>
  <header style="
    background:linear-gradient(90deg,#21103f,#351568);
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #29384d;
  ">
    <div>
      <h2>IrfanTalk</h2>
      <p style="color:#22c55e;font-size:12px;">
        ● Online
      </p>
    </div>

    <button id="profileBtn" style="
      background:linear-gradient(90deg,#792cff,#08c9e8);
      color:white;
      border:0;
      border-radius:50%;
      width:45px;
      height:45px;
      font-size:20px;
    ">
      👤
    </button>
  </header>

  <main id="app">
    <section id="home">
      <h3 style="padding:20px;">
        Welcome to IrfanTalk
      </h3>
    </section>
  

  <section id="friends" style="padding:20px;">
    <h3 style="margin-bottom:15px;">
      👥 My Friends
    </h3>

    <input
      type="text"
      id="searchFriend"
      placeholder="Search friends..."
      style="
        width:100%;
        padding:13px;
        border-radius:10px;
        border:1px solid #35445a;
        background:#21103f;
        color:white;
        margin-bottom:15px;
      "
    >

    <button id="addFriend" style="
      padding:12px 18px;
      background:linear-gradient(90deg,#792cff,#08c9e8);
      color:white;
      border:0;
      border-radius:9px;
    ">
      + Add Friend
    </button>

    <div id="friendsList" style="margin-top:20px;">
      <p style="color:#9ca3af;">
        No friends added yet.
      </p>
    </div>
  </section>

  <section id="walkieTalkie" style="
    padding:25px 20px;
    text-align:center;
    background:linear-gradient(145deg,#21103f,#351568);
    margin:15px;
    border-radius:18px;
  ">
    <h2>🎙️ Walkie-Talkie</h2>

    <p style="color:#9ca3af;margin:15px 0 25px;">
      Press and Hold to Talk
    </p>

    <button id="talkButton" style="
      width:160px;
      height:160px;
      border-radius:50%;
      
      border:6px solid #a855f7;
background:linear-gradient(135deg,#792cff,#08c9e8);
box-shadow:0 0 30px #08c9e899;
      touch-action:none;
    ">
      🎤
    </button>

    <p id="talkStatus" style="
      color:#22c55e;
      margin-top:20px;
    ">
      Ready to Talk
    </p>
  </section>

  <section id="chatSection" style="
    margin:15px;
    padding:20px;
    background:linear-gradient(145deg,#21103f,#351568);
    border-radius:18px;
  ">
    <h2>💬 IrfanTalk Chat</h2>

    <div id="chatMessages" style="
      height:220px;
      overflow-y:auto;
      margin-top:18px;
      padding:12px;
      background:#160d29;
      border-radius:12px;
    ">
      <p style="color:#9ca3af;">
        Welcome to IrfanTalk!
      </p>
    </div>

    <form id="chatForm" style="
      display:flex;
      gap:8px;
      margin-top:15px;
    ">
      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        style="
          flex:1;
          min-width:0;
          padding:13px;
          border:0;
          border-radius:10px;
          background:#21103f;
          color:white;
        "
      >

      <button type="submit" style="
        padding:12px;
        background:linear-gradient(90deg,#792cff,#08c9e8);
        color:white;
        border:0;
        border-radius:10px;
      ">
        Send
      </button>
    </form>
  </section>

 </main>
<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const chatForm = document.getElementById("chatForm");
const messageInput = document.getElementById("messageInput");
const chatMessages = document.getElementById("chatMessages");

chatForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const message = messageInput.value.trim();

    if (!message) return;

    if (!socket.connected) {
        alert("Internet connection check karein.");
        return;
    }

    socket.emit("chat message", message);
    messageInput.value = "";
});

socket.on("chat message", function(message) {
    const msg = document.createElement("p");

    msg.textContent = message;
    msg.style.padding = "10px";
    msg.style.margin = "8px 0";
    msg.style.background = "linear-gradient(90deg, #792cff, #08c9e8)";
    msg.style.borderRadius = "10px";
    msg.style.color = "white";

    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
});

socket.on("connect_error", function() {
    console.log("Chat server connection failed");
});


const addFriendBtn = document.getElementById("addFriend");
const friendsList = document.getElementById("friendsList");
const searchFriend = document.getElementById("searchFriend");

let friends = JSON.parse(localStorage.getItem("irfantalkFriends") || "[]");

function showFriends(filter = "") {
    friendsList.innerHTML = "";

    const filtered = friends.filter(name =>
        name.toLowerCase().includes(filter.toLowerCase())
    );

    if (filtered.length === 0) {
        friendsList.textContent = "No friends found.";
        return;
    }

    filtered.forEach(name => {
        const item = document.createElement("p");
        item.textContent = "👤 " + name;
        item.style.padding = "12px";
        item.style.margin = "8px 0";
        item.style.background = "#263b55";
        item.style.borderRadius = "10px";
        friendsList.appendChild(item);
    });
}

addFriendBtn.addEventListener("click", function() {
    const name = prompt("Enter your friend's name:");
    if (!name || !name.trim()) return;

    const cleanName = name.trim();

    if (friends.includes(cleanName)) {
        alert("Friend already exists.");
        return;
    }

    friends.push(cleanName);
    localStorage.setItem("irfantalkFriends", JSON.stringify(friends));
    showFriends(searchFriend.value);
});

searchFriend.addEventListener("input", function() {
    showFriends(searchFriend.value);
});

showFriends();
</script>

</body>
</html>
