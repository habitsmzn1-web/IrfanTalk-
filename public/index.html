
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IrfanTalk - Connect with Friends</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101311;
 color:white;
 min-height:100vh;
}
header{
 padding:20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#191e19;
 border-bottom:1px solid #303a30;
}
.logo{font-size:25px;font-weight:bold;color:#c6fa54}
.small{color:#9da89c;font-size:13px}
.container{max-width:600px;margin:auto;padding:20px}
.card{
 background:#1b211c;
 border:1px solid #303a30;
 border-radius:20px;
 padding:22px;
 margin:18px 0;
}
h2{margin-top:0}
input{
 width:100%;padding:15px;margin:10px 0;
 border:1px solid #414a40;border-radius:12px;
 background:#111711;color:white;font-size:16px;
}
button{
 border:0;border-radius:12px;padding:14px 18px;
 background:#c6fa54;color:#17200c;
 font-weight:bold;font-size:15px;cursor:pointer;
}
button:disabled{opacity:.5}
.full{width:100%}
.hidden{display:none!important}
#messages{
 height:300px;overflow-y:auto;
 display:flex;flex-direction:column;gap:10px;
}
.msg{
 background:#293229;padding:12px;border-radius:12px;
 overflow-wrap:anywhere;
}
.msg small{display:block;color:#c6fa54;margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
.tabs{display:flex;gap:10px;margin:20px 0}
.tab{
 flex:1;background:#293229;color:white;
}
.tab.active{background:#c6fa54;color:#17200c}
.mic{
 width:145px;height:145px;border-radius:50%;
 background:linear-gradient(145deg,#555,#252525);
 color:white;font-size:42px;
 display:block;margin:25px auto;
}
.status{color:#c6fa54;font-size:13px}
.error{color:#ff8585;margin:10px 0;font-size:14px}
</style>
</head>

<body>

<header>
 <div>
  <div class="logo">IrfanTalk</div>
  <div class="small">Connect • Talk • Together</div>
 </div>
 <div class="status" id="status">Welcome</div>
</header>

<div class="container">

<!-- LOGIN -->
<section id="login">
 <div class="card">
  <h2>Welcome to IrfanTalk 👋</h2>
  <p class="small">Sign in with your mobile number.</p>

  <div id="phoneArea">
   <label>Mobile number</label>
   <input id="phone" type="tel" value="+91" placeholder="+91XXXXXXXXXX">
   <div id="recaptcha-container"></div>
   <br>
   <button class="full" id="sendOtp">Send OTP</button>
  </div>

  <div id="otpArea" class="hidden">
   <label>Enter OTP</label>
   <input id="otp" type="number" placeholder="6-digit OTP">
   <button class="full" id="verifyOtp">Verify OTP</button>
  </div>

  <div id="loginError" class="error"></div>
 </div>
</section>

<!-- APP -->
<section id="app" class="hidden">

 <div class="card">
  <div class="row">
   <div style="flex:1">
    <h2 id="welcome">Hello!</h2>
    <div class="small" id="userPhone"></div>
   </div>
   <button id="logout">Logout</button>
  </div>
 </div>

 <div class="tabs">
  <button class="tab active" id="chatTab">💬 Chat</button>
  <button class="tab" id="voiceTab">🎙️ Walkie-Talkie</button>
 </div>

 <div id="chatSection" class="card">
  <h2>Friends Chat</h2>
  <p class="small">IrfanTalk shared demo room</p>
  <div id="messages"></div>

  <form id="chatForm" class="row">
   <input id="message" placeholder="Write a message..." autocomplete="off">
   <button type="submit">Send</button>
  </form>
  <div id="chatError" class="error"></div>
 </div>

 <div id="voiceSection" class="card hidden">
  <h2>Walkie-Talkie 🎙️</h2>
  <p class="small">Talk to your friends instantly.</p>
  <button class="mic" disabled>🎙️</button>
  <p class="small" style="text-align:center">
   Voice transmission is coming in the next development step.
  </p>
 </div>

</section>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// YOUR FIREBASE CONFIGURATION
const firebaseConfig = {
 apiKey: "AIzaSyAs-r9cPPBpxjswAcAel5WvFQnlU-07XiE",
 authDomain: "irfantalk.firebaseapp.com",
 databaseURL: "https://irfantalk-default-rtdb.firebaseio.com",
 projectId: "irfantalk",
 storageBucket: "irfantalk.firebasestorage.app",
 messagingSenderId: "218169866517",
 appId: "1:218169866517:web:447670dc6a565e1e7b511c"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);

let confirmationResult = null;
let messagesStarted = false;

// SEND OTP
$("sendOtp").addEventListener("click", async () => {
 const phone = $("phone").value.trim();
 $("loginError").textContent = "";

 if(!/^\+[1-9]\d{7,14}$/.test(phone)){
  $("loginError").textContent =
   "Enter a valid number with country code, e.g. +919876543210";
  return;
 }

 try{
  $("sendOtp").disabled = true;

  if(!window.recaptchaVerifier){
   window.recaptchaVerifier =
    new firebase.auth.RecaptchaVerifier(
     "recaptcha-container",
     {size:"normal"}
    );
  }

  await window.recaptchaVerifier.render();

  confirmationResult =
   await auth.signInWithPhoneNumber(
    phone,window.recaptchaVerifier
   );

  $("phoneArea").classList.add("hidden");
  $("otpArea").classList.remove("hidden");
  $("loginError").textContent = "";
 }catch(error){
  $("loginError").textContent = error.message;
  if(window.recaptchaVerifier){
   window.recaptchaVerifier.clear();
   window.recaptchaVerifier = null;
  }
 }finally{
  $("sendOtp").disabled = false;
 }
});

// VERIFY OTP
$("verifyOtp").addEventListener("click",async()=>{
 const otp = $("otp").value.trim();
 $("loginError").textContent = "";

 if(!confirmationResult){
  $("loginError").textContent = "Please request an OTP first.";
  return;
 }

 try{
  await confirmationResult.confirm(otp);
 }catch(error){
  $("loginError").textContent =
   "OTP verification failed: " + error.message;
 }
});

// AUTH STATE
auth.onAuthStateChanged(user=>{
 if(user){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("welcome").textContent = "Welcome to IrfanTalk!";
  $("userPhone").textContent = user.phoneNumber || "";
  $("status").textContent = "● Online";
  startMessages();
 }else{
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("status").textContent = "Welcome";
  $("messages").innerHTML = "";
  messagesStarted = false;
 }
});

// REALTIME CHAT
function startMessages(){
 if(messagesStarted)return;
 messagesStarted = true;

 const chatRef = db.ref("lobby/messages")
  .limitToLast(50);

 chatRef.on("child_added",snapshot=>{
  const data = snapshot.val();
  if(!data)return;

  const item = document.createElement("div");
  item.className = "msg";

  const name = document.createElement("small");
  name.textContent = data.phone || "IrfanTalk User";

  const content = document.createElement("div");
  content.textContent = data.text || "";

  item.appendChild(name);
  item.appendChild(content);

  $("messages").appendChild(item);
  $("messages").scrollTop = $("messages").scrollHeight;
 },error=>{
  $("chatError").textContent =
   "Database access error: " + error.message;
 });
}

// SEND MESSAGE
$("chatForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const user = auth.currentUser;
 const text = $("message").value.trim();

 if(!user || !text)return;

 $("chatError").textContent = "";

 try{
  await db.ref("lobby/messages").push({
   uid:user.uid,
   phone:user.phoneNumber || "User",
   text:text,
   timestamp:firebase.database.ServerValue.TIMESTAMP
  });

  $("message").value = "";
 }catch(error){
  $("chatError").textContent = error.message;
 }
});

// LOGOUT
$("logout").addEventListener("click",()=>{
 auth.signOut();
});

// TABS
$("chatTab").addEventListener("click",()=>{
 $("chatSection").classList.remove("hidden");
 $("voiceSection").classList.add("hidden");
 $("chatTab").classList.add("active");
 $("voiceTab").classList.remove("active");
});

$("voiceTab").addEventListener("click",()=>{
 $("chatSection").classList.add("hidden");
 $("voiceSection").classList.remove("hidden");
 $("voiceTab").classList.add("active");
 $("chatTab").classList.remove("active");
});
</script>

</body>
</html>
