
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>IrfanTalk</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
      min-height: 100vh;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header style="
    background:#182438;
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #29384d;
  ">
    <div>
      <h2>IrfanTalk</h2>
      <p style="color:#22c55e;font-size:12px;">
        ● Online
      </p>
    </div>

    <button id="profileBtn" style="
      background:#263b55;
      color:white;
      border:0;
      border-radius:50%;
      width:45px;
      height:45px;
      font-size:20px;
    ">
      👤
    </button>
  </header>

  <main id="app">
    <section id="home">
      <h3 style="padding:20px;">
        Welcome to IrfanTalk
      </h3>
    </section>
  </main>
