<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IrfanTalk Chat App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: white; padding: 10px 15px; border-radius: 8px; max-width: 75%; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        #form { display: flex; background: white; padding: 10px; border-top: 1px solid #ddd; }
        #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; font-size: 1rem; }
        #send-btn { background: #007bff; color: white; border: none; padding: 10px 20px; margin-left: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>IrfanTalk 💬</header>
    <div id="chat-box"></div>
    <form id="form">
        <input id="input" autocomplete="off" placeholder="Type a message..." required />
        <button id="send-btn">Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const chatBox = document.getElementById('chat-box');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        socket.on('chat message', (msg) => {
            const item = document.createElement('div');
            item.className = 'message';
            item.textContent = msg;
            chatBox.appendChild(item);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
